name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Unit tests and typecheck (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run typecheck
      - name: Launcher (macOS/Linux)
        if: runner.os != 'Windows'
        run: ./coder help
      - name: Launcher (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: coder.cmd help
      - name: VS Code extension package
        run: bun src/cli.ts vscode --package-only

  editor:
    name: Desktop editor bundle matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - working-directory: plugins/coder-editor
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun test
          bun run build
          git diff --exit-code -- gui-experimental.cjs

  e2e:
    name: End to end with the pinned OpenCode (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Sandbox dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Setup downloads and verifies OpenCode
        run: bun src/cli.ts setup
      - name: Sandbox self-test (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          CODER_HOME: ${{ runner.temp }}/coder-home
        run: bun src/cli.ts doctor --test
      - name: Agent run against a mock self-hosted model
        run: bun test/e2e/run.ts
